# [SMDOC] AOT Image Schema
# ========================
# This file defines the binary layout of each artifact in an AOT image. The
# generator uses it to create matching metadata structures and serialization
# helpers. Readers and writers share the same schema.
#
# A blob declares its fixed fields and its trailing arrays. Both are written as
# a single "type: member" pair, where member is the path to the corresponding
# member of the hand written metadata type. Fixed fields use unsigned integer
# types; arrays name their C++ element type.
#
# Everything else is derived. A blob's kind identifier is its position in this
# file and must agree with the runtime enumeration. Each array contributes a
# u32 element count, appended to the fixed fields in array order. Alignment
# padding is inserted so that the serialized form has no implicit padding.
#
# Increment the image format version whenever the schema changes.

blobs:
  BaselineInterpreter:
    doc: "Singleton baseline interpreter blob."
    metadata_type: "js::jit::BaselineInterpreterMetadata"
    fields:
      - u32: interpretOpOffset
      - u32: interpretOpNoDebugTrapOffset
      - u32: bailoutPrologueOffset
      - u32: profilerEnterToggleOffset
      - u32: profilerExitToggleOffset
      - u32: debugTrapHandlerOffset
      - u32: callVMOffsets.debugPrologueOffset
      - u32: callVMOffsets.debugEpilogueOffset
      - u32: callVMOffsets.debugAfterYieldOffset
    arrays:
      - uint32_t: debugInstrumentationOffsets
      - uint32_t: debugTrapOffsets
      - uint32_t: codeCoverageOffsets
      - js::jit::BaselineInterpreterMetadata::ICReturnOffset: icReturnOffsets

  BaselineFunction:
    doc: |
      Per-JSScript baseline JIT code plus the metadata needed to
      reconstruct a BaselineScript on load. Identity is by SHA-1 over
      the JSScript state the compiler reads (see AOTRecorder.cpp).
    metadata_type: "js::jit::BaselineScriptMetadata"
    fields:
      - u32: warmUpCheckPrologueOffset
      - u32: profilerEnterToggleOffset
      - u32: profilerExitToggleOffset
      - u8: flags
    arrays:
      - js::jit::RetAddrEntry: retAddrEntries
      - js::jit::BaselineScript::OSREntry: osrEntries
      - js::jit::BaselineScript::DebugTrapEntry: debugTrapEntries
      - js::jit::ResumeOffsetEntry: resumeOffsetEntries

  InlineCacheStub:
    doc: |
      One AOT-compiled CacheIR stub. On load the CacheIR bytes plus
      the trailing field-type table are used to reconstruct a
      CacheIRStubInfo; the resulting CacheIRStubKey names the static
      text range in the per-zone stub map.
    metadata_type: "js::jit::AOTICStubMetadata"
    fields:
      - u8: cacheKind
      - u8: makesGCCalls
      - u8: stubDataOffset
      - u8: localTracingSlots
    arrays:
      - uint8_t: cacheIRCode
      - uint8_t: fieldTypes

  Configuration:
    doc: "Code-generation options shared by all blobs in the image."
    metadata_type: "js::jit::AOTConfigurationMetadata"
    fields:
      - u8: disableInlining
      - u8: spectreObjectMitigations
      - u8: spectreStringMitigations
      - u8: baselineBatching
      - u32: baselineJitWarmUpThreshold
      - u32: baselineQueueCapacity
      - u32: trialInliningWarmUpThreshold
